version: '3.8'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: mkodockx/docker-clamav:alpine
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo PING | nc -vz 127.0.0.1 3310 || true"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    container_name: bhumidrishti_backend
    working_dir: /app
    volumes:
      - ./:/app:cached
    command: bash -lc "python -m pip install --upgrade pip && pip install --no-cache -r backend/requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CLAMD_HOST=clamav
      - CLAMD_PORT=3310
      - EXPLAIN_CACHE_TTL=3600
    depends_on:
      - redis
      - clamav

  frontend:
    image: node:18
    container_name: bhumidrishti_frontend
    working_dir: /app/frontend
    volumes:
      - ./:/app:cached
    command: bash -lc "cd frontend && npm ci --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

# Optional: add a one-line shortcut to bring the stack up in detached mode
# docker-compose up -d --build
